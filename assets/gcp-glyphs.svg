<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Generic GCP Style Glyphs (Original geometric shapes with badges) -->
    <g id="glyph-client">
      <rect x="-24" y="-20" width="48" height="40" rx="8" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="-18" y="-14" width="36" height="22" rx="3" fill="#E5E7EB"/>
      <circle cx="0" cy="14" r="2" fill="#9CA3AF"/>
    </g>

    <g id="glyph-dns">
      <circle cx="0" cy="0" r="22" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <g id="glyph-lb">
      <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#10B981" stroke="#047857" stroke-width="2"/>
      <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="10" x2="14" y2="10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-6" cy="-10" r="3" fill="#ECFDF5"/>
      <circle cx="4" cy="0" r="3" fill="#ECFDF5"/>
      <circle cx="-2" cy="10" r="3" fill="#ECFDF5"/>
    </g>

    <g id="glyph-nat">
      <polygon points="0,-22 24,0 0,22 -24,0" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
      <text x="0" y="4" font-size="10" font-family="sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NAT</text>
    </g>

    <g id="glyph-router">
      <circle cx="0" cy="0" r="22" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>
      <path d="M -12,-8 L 12,8 M -12,8 L 12,-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-12" cy="-8" r="2.5" fill="#EEF2FF"/>
      <circle cx="12" cy="8" r="2.5" fill="#EEF2FF"/>
      <circle cx="-12" cy="8" r="2.5" fill="#EEF2FF"/>
      <circle cx="12" cy="-8" r="2.5" fill="#EEF2FF"/>
    </g>

    <g id="glyph-vm">
      <rect x="-24" y="-20" width="48" height="40" rx="6" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
      <rect x="-18" y="-14" width="36" height="8" rx="2" fill="#93C5FD"/>
      <rect x="-18" y="-2" width="36" height="8" rx="2" fill="#93C5FD"/>
      <rect x="-18" y="10" width="36" height="4" rx="1" fill="#DBEAFE"/>
    </g>

    <g id="glyph-db">
      <rect x="-20" y="-18" width="40" height="36" rx="4" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
      <ellipse cx="0" cy="-14" rx="18" ry="6" fill="#BAE6FD"/>
      <path d="M -18,-2 C -18,2 18,2 18,-2" stroke="#BAE6FD" stroke-width="2" fill="none"/>
      <path d="M -18,8 C -18,12 18,12 18,8" stroke="#BAE6FD" stroke-width="2" fill="none"/>
    </g>
