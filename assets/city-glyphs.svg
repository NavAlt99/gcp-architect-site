<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Cloud City Glyphs: Building, Road, Gate, Warehouse, Vault, Courier, Badge, Control Room -->
    <g id="city-building">
      <rect x="-20" y="-25" width="40" height="50" rx="3" fill="#64748B" stroke="#334155" stroke-width="2"/>
      <rect x="-14" y="-20" width="8" height="8" fill="#F8FAFC"/>
      <rect x="6" y="-20" width="8" height="8" fill="#F8FAFC"/>
      <rect x="-14" y="-8" width="8" height="8" fill="#F8FAFC"/>
      <rect x="6" y="-8" width="8" height="8" fill="#F8FAFC"/>
      <rect x="-6" y="10" width="12" height="15" fill="#1E293B"/>
    </g>

    <g id="city-gate">
      <rect x="-24" y="-22" width="10" height="44" fill="#475569"/>
      <rect x="14" y="-22" width="10" height="44" fill="#475569"/>
      <path d="M -14,-14 L 14,-14" stroke="#DC2626" stroke-width="3"/>
      <path d="M -14,0 L 14,0" stroke="#DC2626" stroke-width="3"/>
      <circle cx="0" cy="-7" r="5" fill="#EF4444"/>
    </g>

    <g id="city-courier">
      <circle cx="0" cy="-12" r="8" fill="#F59E0B"/>
      <rect x="-10" y="-4" width="20" height="24" rx="4" fill="#D97706"/>
      <rect x="6" y="0" width="8" height="12" fill="#FEF3C7" stroke="#B45309"/>
    </g>

    <g id="city-postoffice">
      <polygon points="0,-24 24,-10 -24,-10" fill="#3B82F6"/>
      <rect x="-20" y="-10" width="40" height="30" fill="#60A5FA"/>
      <rect x="-6" y="2" width="12" height="18" fill="#1E3A8A"/>
    </g>

    <g id="city-road">
      <rect x="-40" y="-8" width="80" height="16" fill="#334155"/>
      <line x1="-35" y1="0" x2="-15" y2="0" stroke="#FACC15" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="5" y1="0" x2="25" y2="0" stroke="#FACC15" stroke-width="2" stroke-dasharray="6,4"/>
    </g>

    <g id="city-inspector">
      <circle cx="0" cy="-14" r="8" fill="#0D9488"/>
      <path d="M -10,0 L 10,0 L 8,18 L -8,18 Z" fill="#14B8A6"/>
      <circle cx="6" cy="6" r="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
      <line x1="10" y1="10" x2="16" y2="16" stroke="#0F766E" stroke-width="2.5"/>
    </g>
  </defs>
</svg>
